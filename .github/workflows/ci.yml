# The kit's own gate. The kit tells every host repo "a suite nobody runs on
# push is a gate that stopped gating" (TESTING_STANDARDS.md §6) — this makes
# the kit hold itself to that line. Stdlib-only runtime (DEC-0017): the suite's
# only install is the test runner and the linter; the scanners are dev tooling
# in their own job.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The scanner-bump workflow dispatches this on its branch: a push made with
  # the built-in GITHUB_TOKEN starts no workflows, a dispatch does. No secret.
  workflow_dispatch:

# A superseded push to the same PR cancels its stale run instead of billing
# minutes for a result nobody will read. main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token for every job; nothing here writes to the repository.
permissions: {}

# Actions are pinned to a full commit SHA (the tag in the comment): a moved
# tag cannot swap the code that runs with this workflow's token (zizmor
# unpinned-uses). The weekly scanner-bump PR is where pins move.
# GitHub-hosted on purpose (the owner's Actions rules, 2026-10-05, rule 7): this repository is
# public, so its hosted minutes are free and a self-hosted runner on the owner's PC must never run a
# stranger's code. MU/TH/UR lists only private repositories for SET UP RUNNER, so a local-first
# runs-on here would wait for a runner that never comes. No job here reads a secret.
jobs:
  # Docs-only changes (docs/, root *.md, LICENSE) skip the scans (Actions rule 4). The suite still
  # runs: forty of its tests read the documents (the guide, the context files, the budgets), so it
  # IS the docs pass here. Anything unreadable counts as code (absent is not zero); --no-renames lists
  # a rename's old path too, so moving code into docs/ still runs the scans.
  changes:
    name: Docs-only change?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only --no-renames "$BASE" "$HEAD_SHA" || true)
          else
            files=$(git diff --name-only --no-renames "$BEFORE" "$HEAD_SHA" 2>/dev/null || true)
          fi
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(docs/|LICENSE$|[^/]+\.md$)'; then code=false; else code=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "changed files: $(printf '%s\n' "$files" | wc -l); code=$code"

  suite:
    name: Kit suite (pytest + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test runner + linter
        run: python -m pip install --quiet pytest ruff
      - name: Lint (correctness rules — E4/E7/E9/F)
        run: |
          ruff check tools/wall --isolated --select E4,E7,E9,F
          ruff check tests --isolated --select F
      - name: Test suite
        run: python -m pytest tests/ -q

  scans:
    # The structural-scan lane (TESTING_STANDARDS.md section 5.1): ast-grep
    # rules derived from the failure registry, SkillSpector over the agent
    # surface, gitleaks over the full history, ruff's security rules, and
    # actionlint + zizmor over these workflows. Pinned versions; report-only
    # until a rule is promoted in tools/quality/quality.json, except secrets,
    # which always block. Runs beside the suite, not after.
    name: Structural and security scans
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0   # gitleaks scans every commit, not just the tip
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/quality/quality.json
      - name: Install scanners at their pins
        run: bash tools/quality/install.sh
      - name: Scan
        run: bash tools/quality/scan.sh ci
